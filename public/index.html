<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oman Dealz — Great finds, better prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1015; --panel: #181B22; --ink: #F3F2ED; --ink-soft: #9B9A93;
    --forest: #FF5A3C; --forest-dark: #E8442F; --gold: #F2B84B;
    --line: #2A2E38; --tag-string: #454B58;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:18px 32px;}
  .logo{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;}
  .logo span{color:var(--forest);}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:42px; height:42px; border-radius:10px; background:var(--forest); display:flex;
    align-items:center; justify-content:center; flex-shrink:0;}
  .brand-mark svg{width:24px; height:24px;}
  .brand-text{display:flex; flex-direction:column; line-height:1.1;}
  .brand-text .en{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:-0.2px;}
  .brand-text .en em{color:var(--gold); font-style:normal;}
  .brand-text .ar{font-family:'Tajawal',sans-serif; font-weight:500; font-size:12px; color:var(--ink-soft); direction:rtl;}
  #cart-btn{display:flex; align-items:center; gap:8px; background:var(--forest); color:#fff;
    border:none; padding:10px 16px; border-radius:3px; cursor:pointer; font-size:14px; font-weight:500;}
  #cart-count{background:var(--gold); color:var(--ink); border-radius:50%; width:20px; height:20px;
    display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:600;}
  .hero{padding:72px 32px 80px; text-align:center; background:linear-gradient(180deg, #1B1E27 0%, var(--bg) 100%);}
  .hero .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase;
    color:var(--forest); margin-bottom:18px;}
  .hero h1{font-size:clamp(34px, 6vw, 58px); font-weight:700; line-height:1.05; margin:0 0 16px; letter-spacing:-0.5px;}
  .hero p{color:var(--ink-soft); font-size:16px; max-width:480px; margin:0 auto;}
  .hero .ar-tag{font-family:'Tajawal',sans-serif; direction:rtl; color:var(--ink-soft); font-size:14px; margin-top:8px; display:block;}
  .section-label{padding:0 32px; margin:0 0 28px;}
  .section-label h2{font-size:24px; font-weight:500; margin:0;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:28px; padding:0 32px 100px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden;
    display:flex; flex-direction:column; transition:transform .15s ease, box-shadow .15s ease;}
  .card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(0,0,0,0.4);}
  .thumb{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:40px;
    border-bottom:1px solid var(--line); background:#20242E; overflow:hidden;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .card-body{padding:16px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .card-body h3{font-size:16px; font-weight:600; margin:0; font-family:'Inter',sans-serif;}
  .card-body .desc{color:var(--ink-soft); font-size:13px; line-height:1.4; margin:0; flex:1;}
  .tag-row{display:flex; align-items:center; justify-content:space-between; margin-top:4px;}
  .price-tag{background:#20242E; border:1px solid var(--line); border-radius:2px; padding:6px 12px;
    font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:500;}
  .add-btn{background:transparent; border:1px solid var(--ink); color:var(--ink); padding:8px 14px;
    border-radius:3px; font-size:13px; font-weight:600; cursor:pointer;}
  .add-btn:hover{background:var(--ink); color:var(--bg);}
  .add-btn.added{background:var(--forest); border-color:var(--forest); color:#fff;}
  .add-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .out-of-stock{font-size:11px; color:#FF7A63; font-weight:600; text-transform:uppercase;}
  #overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:60;}
  #overlay.open{opacity:1; pointer-events:auto;}
  #drawer{position:fixed; top:0; right:-420px; width:400px; max-width:90vw; height:100%;
    background:var(--bg); z-index:70; box-shadow:-8px 0 30px rgba(0,0,0,0.15);
    transition:right .3s ease; display:flex; flex-direction:column;}
  #drawer.open{right:0;}
  .drawer-head{display:flex; justify-content:space-between; align-items:center; padding:22px 24px; border-bottom:1px solid var(--line);}
  .close-btn{background:none; border:none; font-size:22px; cursor:pointer; color:var(--ink-soft);}
  #cart-items{flex:1; overflow-y:auto; padding:16px 24px;}
  .empty-cart{color:var(--ink-soft); font-size:14px; text-align:center; padding:60px 20px;}
  .cart-line{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center;}
  .cart-thumb{width:48px; height:48px; background:var(--panel); border:1px solid var(--line); border-radius:3px;
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; overflow:hidden;}
  .cart-thumb img{width:100%; height:100%; object-fit:cover;}
  .cart-info{flex:1;}
  .cart-info .name{font-size:14px; font-weight:600;}
  .cart-info .price{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .qty-controls{display:flex; align-items:center; gap:8px;}
  .qty-controls button{width:22px; height:22px; border:1px solid var(--line); background:var(--panel);
    border-radius:2px; cursor:pointer; font-size:13px;}
  .drawer-foot{padding:20px 24px 26px; border-top:1px solid var(--line);}
  .total-row{display:flex; justify-content:space-between; font-size:15px; margin-bottom:16px; font-weight:600;}
  .checkout-btn{width:100%; background:var(--forest); color:#fff; border:none; padding:14px; border-radius:3px;
    font-size:14px; font-weight:600; cursor:pointer;}
  .checkout-btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  #checkout-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:80; display:none;
    align-items:center; justify-content:center; padding:20px;}
  #checkout-overlay.open{display:flex;}
  .modal{background:var(--bg); border-radius:6px; width:440px; max-width:100%; max-height:90vh; overflow-y:auto; padding:32px;}
  .modal h2{margin:0 0 6px; font-size:24px; font-weight:500;}
  .modal .sub{color:var(--ink-soft); font-size:13px; margin:0 0 24px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; margin-bottom:6px; color:var(--ink-soft);}
  .field input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:3px; font-size:14px;
    font-family:'Inter',sans-serif; background:var(--panel);}
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}
  .place-order{width:100%; background:var(--ink); color:var(--bg); border:none; padding:14px; border-radius:3px;
    font-size:14px; font-weight:600; cursor:pointer; margin-top:8px;}
  .success{text-align:center; padding:20px 0;}
  .success .icon{font-size:44px; margin-bottom:12px;}
  .loading, .empty-state{padding:60px 32px; text-align:center; color:var(--ink-soft);}
  footer{text-align:center; padding:24px; color:var(--ink-soft); font-size:12px; border-top:1px solid var(--line);}
  footer a{color:var(--ink-soft);}
  @media (max-width: 640px){
    header{padding:14px 18px;} .hero{padding:48px 20px 56px;}
    .grid{padding:0 18px 60px; gap:18px;} .section-label{padding:0 18px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L10 18L20 6" stroke="#FAFAF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="10.5" stroke="#FAFAF8" stroke-width="1.4"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="en">Oman <em>Dealz</em></span>
      <span class="ar">عروض عُمان</span>
    </div>
  </div>
  <button id="cart-btn" onclick="openDrawer()">Cart <span id="cart-count">0</span></button>
</header>

<section class="hero">
  <div class="eyebrow">DEALS ACROSS OMAN · SHIPPED TO YOUR DOOR</div>
  <h1>Great finds. Better prices.</h1>
  <p>Hand-picked products at prices that actually make sense.</p>
  <span class="ar-tag">عروض مختارة بأسعار تستحق</span>
</section>

<div class="section-label"><h2>The full shelf</h2></div>
<div class="grid" id="product-grid"><div class="loading">Loading products…</div></div>

<footer>
  Store admin: <a href="/admin">/admin</a>
</footer>

<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="drawer-head"><h2>Your cart</h2><button class="close-btn" onclick="closeDrawer()">&times;</button></div>
  <div id="cart-items"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Total</span><span id="cart-total" class="mono">OMR 0.000</span></div>
    <button class="checkout-btn" id="checkout-btn" onclick="openCheckout()" disabled>Checkout</button>
  </div>
</div>

<div id="checkout-overlay"><div class="modal" id="checkout-modal"></div></div>

<script>
let PRODUCTS = [];
let cart = {};

function fmt(n){ return 'OMR ' + n.toFixed(3); }

async function loadProducts(){
  try{
    const res = await fetch('/api/products');
    PRODUCTS = await res.json();
    renderProducts();
  }catch(e){
    document.getElementById('product-grid').innerHTML =
      '<div class="empty-state">Could not load products. Is the server running?</div>';
  }
}

function renderProducts(){
  const grid = document.getElementById('product-grid');
  if(PRODUCTS.length === 0){
    grid.innerHTML = '<div class="empty-state">No products yet — add some from the admin panel.</div>';
    return;
  }
  grid.innerHTML = PRODUCTS.map(p => `
    <div class="card">
      <div class="thumb">${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : '🛍️'}</div>
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="desc">${p.description || ''}</p>
        <div class="tag-row">
          <div class="price-tag">${fmt(p.price)}</div>
          ${p.in_stock
            ? `<button class="add-btn" id="add-${p.id}" onclick="addToCart(${p.id})">Add</button>`
            : `<span class="out-of-stock">Out of stock</span>`}
        </div>
      </div>
    </div>
  `).join('');
}

function addToCart(id){
  cart[id] = (cart[id] || 0) + 1;
  const btn = document.getElementById('add-'+id);
  btn.textContent = 'Added'; btn.classList.add('added');
  setTimeout(()=>{ btn.textContent='Add'; btn.classList.remove('added'); }, 900);
  renderCart();
}

function changeQty(id, delta){
  if(!cart[id]) return;
  cart[id] += delta;
  if(cart[id] <= 0) delete cart[id];
  renderCart();
}

function renderCart(){
  const ids = Object.keys(cart);
  const count = ids.reduce((s,id)=>s+cart[id],0);
  document.getElementById('cart-count').textContent = count;
  const container = document.getElementById('cart-items');
  if(ids.length === 0){
    container.innerHTML = '<div class="empty-cart">Your cart is empty.</div>';
    document.getElementById('cart-total').textContent = fmt(0);
    document.getElementById('checkout-btn').disabled = true;
    return;
  }
  let total = 0;
  container.innerHTML = ids.map(id => {
    const p = PRODUCTS.find(p=>p.id == id);
    const qty = cart[id];
    total += p.price * qty;
    return `
      <div class="cart-line">
        <div class="cart-thumb">${p.image_url ? `<img src="${p.image_url}">` : '🛍️'}</div>
        <div class="cart-info">
          <div class="name">${p.name}</div>
          <div class="price">${fmt(p.price)} each</div>
        </div>
        <div class="qty-controls">
          <button onclick="changeQty(${id}, -1)">−</button>
          <span class="mono">${qty}</span>
          <button onclick="changeQty(${id}, 1)">+</button>
        </div>
      </div>`;
  }).join('');
  document.getElementById('cart-total').textContent = fmt(total);
  document.getElementById('checkout-btn').disabled = false;
}

function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
function openCheckout(){ renderCheckoutForm(); document.getElementById('checkout-overlay').classList.add('open'); }
function closeCheckout(){ document.getElementById('checkout-overlay').classList.remove('open'); }

function renderCheckoutForm(){
  const ids = Object.keys(cart);
  let total = 0;
  ids.forEach(id=>{ const p = PRODUCTS.find(p=>p.id==id); total += p.price * cart[id]; });
  document.getElementById('checkout-modal').innerHTML = `
    <h2>Checkout</h2>
    <p class="sub">Enter shipping details to place your order.</p>
    <div class="field"><label>Full name</label><input type="text" id="ck-name"></div>
    <div class="field"><label>Email</label><input type="email" id="ck-email"></div>
    <div class="field"><label>Shipping address</label><input type="text" id="ck-address"></div>
    <div class="field-row">
      <div class="field"><label>City</label><input type="text" id="ck-city"></div>
      <div class="field"><label>Postal code</label><input type="text" id="ck-zip"></div>
    </div>
    <div class="total-row"><span>Order total</span><span class="mono">${fmt(total)}</span></div>
    <button class="place-order" onclick="placeOrder()">Place order</button>
  `;
}

async function placeOrder(){
  const name = document.getElementById('ck-name').value;
  const email = document.getElementById('ck-email').value;
  const address = document.getElementById('ck-address').value;
  const city = document.getElementById('ck-city').value;
  const zip = document.getElementById('ck-zip').value;

  if(!name || !email || !address){
    alert('Please fill in name, email, and address.');
    return;
  }

  const ids = Object.keys(cart);
  let total = 0;
  const items = ids.map(id => {
    const p = PRODUCTS.find(p=>p.id==id);
    total += p.price * cart[id];
    return { id: p.id, name: p.name, price: p.price, qty: cart[id] };
  });

  try{
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ customer_name: name, email, address, city, zip, items, total })
    });
    if(!res.ok) throw new Error('Order failed');
    document.getElementById('checkout-modal').innerHTML = `
      <div class="success">
        <div class="icon">✓</div>
        <h2>Order placed, ${name.split(' ')[0]}</h2>
        <p>We've saved your order. This demo doesn't process real payment yet —<br>that connects in the next step.</p>
        <button class="place-order" onclick="finishOrder()">Back to shop</button>
      </div>`;
  }catch(e){
    alert('Something went wrong placing your order. Please try again.');
  }
}

function finishOrder(){
  cart = {};
  renderCart();
  closeCheckout();
  closeDrawer();
}

loadProducts();
renderCart();
</script>
</body>
</html>
